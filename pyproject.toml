[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "picfinder"
version = "0.1.7"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "work/dictionary/zh/LICENSE"]
description = "面向画师的参考图检索与归档工具"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 打包与发布阶段使用，运行期不需要。
package = ["pyinstaller>=6.0"]
# 仅 work/make_icon.py 绘制图标时需要。标注模型尚未实现。
icons = ["Pillow>=10"]

[project.scripts]
picfinder = "picfinder.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["picfinder*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
